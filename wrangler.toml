name = "stashfound-import"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"

# Exact browser Origins only (scheme + host + port). No wildcards.
# Production: wrangler.toml [vars] or the Cloudflare dashboard — include your
# GitHub Pages origin, e.g. https://you.github.io
[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"

# Optional: wrangler secret put TURNSTILE_SECRET
# When set, POST /import requires a valid Turnstile token.

[[ratelimits]]
name = "IMPORT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 8
  period = 60

[dev]
port = 8787
# Local secrets: worker/.dev.vars via `npm run worker` (--env-file).
# Do not let Wrangler ingest the Next.js .env.local.
