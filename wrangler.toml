name = "poe-stashfound"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"

# Cloudflare Git deploy with an empty UI build command still needs the static
# export. Local `npm run worker` also runs this (slower first start).
[build]
command = "npm run build:static"

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/import", "/health"]

# Exact browser Origins for cross-origin calls (GitHub Pages). Same-origin
# POSTs to this Worker are always allowed.
[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://dmtlnc.github.io"

# Optional: wrangler secret put TURNSTILE_SECRET
# When set, POST /import requires a valid Turnstile token.

[[ratelimits]]
name = "IMPORT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 8
  period = 60

[dev]
port = 8787
# Local secrets: worker/.dev.vars via `npm run worker` (--env-file).
# Do not let Wrangler ingest the Next.js .env.local.
